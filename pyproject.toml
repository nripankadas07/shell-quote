[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shell-quote"
version = "1.0.0"
description = "Zero-dependency POSIX shell quoting, splitting, and safety checks."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Nripanka Das", email = "nripankadas@gmail.com"}]
keywords = [
    "shell",
    "quote",
    "quoting",
    "shlex",
    "posix",
    "bash",
    "sh",
    "escape",
    "subprocess",
    "security",
    "zero-dependency",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.urls]
Homepage = "https://github.com/nripankadas07/shell-quote"
Repository = "https://github.com/nripankadas07/shell-quote"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shell_quote = ["py.typed"]
